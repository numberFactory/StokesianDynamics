[build-system]
requires = [
    "setuptools>=61.0",
    "nanobind>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "Lubrication"
version = "0.1.0"
description = "Lubrication corrections for rigid body hydrodynamics via nanobind"
requires-python = ">=3.8"

[tool.setuptools]
py-modules=["body"]

[tool.setuptools.package-dir]
"" = "src"